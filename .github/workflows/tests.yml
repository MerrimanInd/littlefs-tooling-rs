name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Sanity-check the flake itself (evaluates all outputs: devShells,
  # packages, etc. for the current runner's system).
  # ---------------------------------------------------------------------
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check

  # ---------------------------------------------------------------------
  # Core Rust checks in the default shell: this is what exercises
  # littlefs2-sys's cbindgen build (LIBCLANG_PATH / bindgen env from
  # the flake) since it runs on every `cargo build`.
  #
  # mklittlefs is pkgs.mklittlefs from nixpkgs, substituted from
  # cache.nixos.org as part of entering the devShell — no separate
  # build/warm-cache step needed for it.
  # ---------------------------------------------------------------------
  test-default:
    name: cargo test (default shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-default-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-default-${{ runner.os }}-

      - name: fmt
        run: nix develop .#default -c cargo fmt --all -- --check

      - name: clippy
        run: nix develop .#default -c cargo clippy --workspace --all-targets -- -D warnings

      - name: build (triggers littlefs2-sys / bindgen)
        run: nix develop .#default -c cargo build --workspace --verbose

      - name: test (uses MKLITTLEFS_CPP, set in the default devShell)
        run: nix develop .#default -c cargo test --workspace --verbose

  # ---------------------------------------------------------------------
  # API-stability check on the published library crate.
  # ---------------------------------------------------------------------
  semver-checks:
    name: cargo-semver-checks
    needs: test-default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semver-checks needs history to diff against
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop .#default -c cargo semver-checks check-release --package littlefs2-pack

  # ---------------------------------------------------------------------
  # RP2350: cross-compile only (no hardware in CI, no flashing).
  # ---------------------------------------------------------------------
  build-rp2350:
    name: Build RP2350 example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo (rp target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/rp2350-list-lfs-files/target
          key: cargo-rp-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rp-${{ runner.os }}-

      - name: cargo build --target thumbv8m.main-none-eabihf
        run: |
          nix develop .#rp -c bash -c '
            set -euxo pipefail
            cd examples/rp2350-list-lfs-files
            cargo build --target thumbv8m.main-none-eabihf --release
          '

  # ---------------------------------------------------------------------
  # ESP32: cross-compile only. Slower and flakier than the others since
  # espup fetches the Xtensa toolchain at runtime rather than via Nix,
  # so this job is allowed to fail without blocking the rest of CI.
  # ---------------------------------------------------------------------
  build-esp32:
    name: Build ESP32 example
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache espup toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.espressif
            ~/export-esp.sh
          key: espup-${{ runner.os }}-v1

      - name: Install Xtensa toolchain via espup (skipped if cached)
        run: |
          nix develop .#esp -c bash -c '
            set -euxo pipefail
            if [ ! -f "$HOME/export-esp.sh" ]; then
              espup install --targets esp32s3
            fi
          '

      - name: Cache cargo (esp target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/esp32-list-lfs-files/target
            examples/esp32-littlefs-server/target
          key: cargo-esp-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-esp-${{ runner.os }}-

      - name: cargo build esp32-list-lfs-files --target xtensa-esp32s3-none-elf
        run: |
          nix develop .#esp -c bash -c '
            set -euxo pipefail
            source "$HOME/export-esp.sh"
            export CC_xtensa_esp32s3_none_elf=xtensa-esp32s3-elf-gcc
            export AR_xtensa_esp32s3_none_elf=xtensa-esp32s3-elf-ar
            cd examples/esp32-list-lfs-files
            cargo build --target xtensa-esp32s3-none-elf --release
          '

      - name: cargo build esp32-littlefs-server --target xtensa-esp32s3-none-elf
        run: |
          nix develop .#esp -c bash -c '
            set -euxo pipefail
            source "$HOME/export-esp.sh"
            export CC_xtensa_esp32s3_none_elf=xtensa-esp32s3-elf-gcc
            export AR_xtensa_esp32s3_none_elf=xtensa-esp32s3-elf-ar
            cd examples/esp32-littlefs-server
            cargo build --target xtensa-esp32s3-none-elf --release
          '

  # ---------------------------------------------------------------------
  # Single required status check for branch protection, so you don't
  # have to update protection rules every time a job is renamed/added.
  # ---------------------------------------------------------------------
  ci-success:
    name: CI success
    if: always()
    needs:
      - flake-check
      - test-default
      - semver-checks
      - build-rp2350
      - build-esp32
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.flake-check.result }}" != "success" ] || \
             [ "${{ needs.test-default.result }}" != "success" ] || \
             [ "${{ needs.semver-checks.result }}" != "success" ] || \
             [ "${{ needs.build-rp2350.result }}" != "success" ]; then
            echo "A required job failed."
            exit 1
          fi
          echo "All required jobs passed (build-esp32 is best-effort)."
